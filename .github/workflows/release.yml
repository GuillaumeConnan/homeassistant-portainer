name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Validate notes and prepare release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and extract changelog section
        run: |
          python .github/generate_releasenotes.py \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --server-url "$GITHUB_SERVER_URL" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Publish changelog as release notes
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Update packaged integration version
        run: |
          python .github/update_version.py --version "${RELEASE_TAG#v}"

      - name: Zip integration
        working-directory: custom_components/portainer
        run: zip -r "$RUNNER_TEMP/portainer.zip" .

      - name: Upload integration archive
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/portainer.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
