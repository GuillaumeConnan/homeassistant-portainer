name: CI

on:
  push:
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/generate_releasenotes.py'
      - 'CHANGELOG.md'
      - 'requirements*.txt'
      - 'Pipfile'
      - 'pytest.ini'
      - 'tox.ini'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'custom_components/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/generate_releasenotes.py'
      - 'CHANGELOG.md'
      - 'requirements*.txt'
      - 'Pipfile'
      - 'pytest.ini'
      - 'tox.ini'
  workflow_dispatch:

jobs:

  black:
    name: Python Code Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v4"
      - name: Black Code Format Check
        uses: psf/black@stable
        with:
          version: ">=26.10.1"
          src: "."
          options: "--check --fast --diff"

  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ['homeassistant==2026.9.0', 'homeassistant>=2026.9.0']
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v4"
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt "${{ matrix.homeassistant }}"
      - name: Run tests
        run: pytest
      - name: Lint with flake8
        run: |
          pip install "flake8>=7.4.1"
          flake8 . --count --select=E9,F63,F7,F82 --ignore W503,E722,F722  --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics
  security:
    name: Security check - Bandit
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v4"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install "bandit>=1.9.4"
      - name: Run Bandit
        run: |
          mkdir -p output
          bandit -c .github/bandit.yaml -r custom_components/portainer -o output/security_report.txt -f txt
        continue-on-error: true
      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: Security report
          path: output/security_report.txt

  validate:
    name: Check hassfest
    needs: [tests]
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v4"
      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
