---
perform_container_action:
  name: Perform Container Action
  description: Performs a specified action (start, stop, restart, kill, remove) on one or more containers.
  fields:
    action:
      name: Action
      description: The action to perform on the containers.
      required: true
      selector:
        select:
          options:
            - start
            - stop
            - restart
            - kill
            - remove
    container_devices:
      name: Container Devices
      description: A list of Docker container devices to perform the action on.
      required: true
      selector:
        device:
          multiple: true
          filter:
            integration: portainer
            model: Container

    force:
      name: Force Removal
      description: Force removal of running containers. Only used with the remove action.
      default: false
      selector:
        boolean: {}
    remove_volumes:
      name: Remove Anonymous Volumes
      description: Remove anonymous volumes associated with the containers. Named volumes are not removed. Only used with the remove action.
      default: false
      selector:
        boolean: {}

perform_stack_action:
  name: Perform Stack Action
  description: Performs a specified action (start, stop) on one or more stacks.
  fields:
    action:
      name: Action
      description: The action to perform on the stacks.
      required: true
      selector:
        select:
          options:
            - start
            - stop
    stack_devices:
      name: Stack Devices
      description: A list of Portainer stack devices to perform the action on.
      required: true
      selector:
        device:
          multiple: true
          filter:
            integration: portainer
            model: Stack

recreate_container:
  name: Recreate Container
  description: Recreates a container, pulling the latest image.
  fields:
    container_devices:
      name: Container Devices
      description: A list of Docker container devices to recreate.
      required: true
      selector:
        device:
          multiple: true
          filter:
            integration: portainer
            model: Container
    pull_image:
      name: Pull Image
      description: Whether to pull the latest image before recreating the container.
      required: false
      default: true
      selector:
        boolean: {}
